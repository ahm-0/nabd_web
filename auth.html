<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d19"><title>نبض التفوق | إنشاء حساب الطالب</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="styles.css"><style>
.auth-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,rgba(48,133,255,.2),transparent 34%),var(--bg)}.auth-shell{width:min(980px,100%);display:grid;grid-template-columns:1fr 1.25fr;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:var(--surface);box-shadow:0 24px 70px rgba(0,0,0,.28)}.auth-intro{padding:42px;background:linear-gradient(145deg,#10294b,#0d1729);color:#fff}.auth-intro h1{font-size:32px;margin:20px 0 12px}.auth-intro p{color:#c9d7ea;line-height:1.9}.auth-form-wrap{padding:36px}.auth-form-wrap h2{margin:0 0 8px}.auth-form-wrap>p{color:var(--muted);margin:0 0 24px}.auth-form{display:grid;gap:14px}.auth-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.auth-grid .full{grid-column:1/-1}.auth-form label{display:grid;gap:7px;font-weight:700;font-size:13px}.auth-form input,.auth-form select{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font:inherit}.auth-form input:focus,.auth-form select:focus{outline:2px solid rgba(45,132,255,.35);border-color:#3288ff}.auth-switch{margin-top:18px;text-align:center;color:var(--muted)}.auth-switch button{border:0;background:none;color:var(--primary);font:inherit;font-weight:800;cursor:pointer}.auth-message{min-height:24px;margin:4px 0;color:#f08a8a;font-size:13px}.auth-message.success{color:#53c991}.auth-note{font-size:12px;color:var(--muted);line-height:1.7}@media(max-width:760px){.auth-shell{grid-template-columns:1fr}.auth-intro{padding:26px}.auth-intro h1{font-size:26px}.auth-form-wrap{padding:24px}.auth-grid{grid-template-columns:1fr}.auth-grid .full{grid-column:auto}}
</style></head><body data-page="auth"><main class="auth-page"><section class="auth-shell"><aside class="auth-intro"><span class="brand-mark"><i class="fa-solid fa-wave-square"></i></span><h1>نبض التفوق</h1><p>مساحتك الدراسية المنظمة لمتابعة رحلتك التعليمية، حفظ إنجازاتك، والوصول إلى أدواتك من أي جهاز.</p><p class="auth-note">بياناتك الشخصية محفوظة في حسابك الآمن، ولا تظهر إلا لك.</p></aside><section class="auth-form-wrap"><h2 id="authTitle">إنشاء حساب الطالب</h2><p id="authSubtitle">ابدأ بإنشاء حسابك ثم أكمل بياناتك الدراسية.</p><form id="authForm" class="auth-form"><div class="auth-grid" id="signupFields"><label>الاسم الأول<input name="first_name" autocomplete="given-name" required></label><label>اسم الأب<input name="father_name" autocomplete="additional-name" required></label><label>الكنية<input name="family_name" autocomplete="family-name" required></label><label class="full">المرحلة الدراسية<select name="study_stage" required><option value="">اختر المرحلة الدراسية</option><option>التاسع</option><option>بكالوريا علمي</option><option>بكالوريا أدبي</option><option>ثانوي</option><option>مرحلة جامعية</option></select></label></div><label>البريد الإلكتروني<input name="email" type="email" autocomplete="email" required></label><label>كلمة السر<input name="password" type="password" minlength="6" autocomplete="new-password" required></label><p id="authMessage" class="auth-message" role="status"></p><button class="primary-button" type="submit" id="authSubmit"><i class="fa-solid fa-user-plus"></i> إنشاء الحساب</button></form><p class="auth-switch"><span id="authSwitchText">لديك حساب بالفعل؟</span> <button type="button" id="authModeToggle">تسجيل الدخول</button></p></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="auth.js"></script></body></html>

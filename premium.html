  async function loadBranches(push = false) { const args = { p_section_slug: 'baccalaureate' }; state.branch = null; state.teacher = null; state.subject = null; const cached = readCache('premium_list_branches', args); if (cached) render(cached, 'branch', 'اختر الفرع', 'ابدأ باختيار بكالوريا علمي أو بكالوريا أدبي.', item => card('branch', item, item.description), push); else setLoading(); try { const data = await rpc('premium_list_branches', args); render(data, 'branch', 'اختر الفرع', 'ابدأ باختيار بكالوريا علمي أو بكالوريا أدبي.', item => card('branch', item, item.description), push); } catch (error) { if (!cached) setEmpty('تعذر تحميل الفروع', friendlyError(error, 'تحقق من الاتصال ثم حاول مرة أخرى.')); } }
  async function loadTeachers(branch, push = true) { const args = { p_branch_id: branch.id }; state.branch = branch; state.teacher = null; state.subject = null; const cached = readCache('premium_list_teachers', args); if (cached) render(cached, 'teacher', branch.name, 'اختر الأستاذ للوصول إلى مواده وملفاته.', item => { const extra = item.bundle_enabled ? `<span class="premium-file-meta"><span class="premium-badge premium-price"><i class="fa-solid fa-layer-group"></i> كود شامل: ${escapeHTML(item.bundle_price)} ل.س</span></span>` : ''; return card('teacher', item, item.description || 'مواد وملفات الأستاذ ضمن القسم المميز.', extra); }, push); else setLoading(); try { const data = await rpc('premium_list_teachers', args); render(data, 'teacher', branch.name, 'اختر الأستاذ للوصول إلى مواده وملفاته.', item => { const extra = item.bundle_enabled ? `<span class="premium-file-meta"><span class="premium-badge premium-price"><i class="fa-solid fa-layer-group"></i> كود شامل: ${escapeHTML(item.bundle_price)} ل.س</span></span>` : ''; return card('teacher', item, item.description || 'مواد وملفات الأستاذ ضمن القسم المميز.', extra); }, push); } catch (error) { if (!cached) setEmpty('تعذر تحميل الأساتذة', friendlyError(error, 'حاول مرة أخرى.')); } }

  async function loadFiles(subject, push = true) { const args = { p_subject_id: subject.id }; state.subject = subject; const cached = readCache('premium_list_files', args); if (cached) render(cached, 'file', subject.name, 'افتح الملف بعد التحقق من صلاحية الوصول.', item => { const extra = `<span class="premium-file-meta"><span class="premium-badge premium-price"><i class="fa-solid fa-tag"></i> كود الملف: ${escapeHTML(item.access_price)} ل.س</span>${item.bundle_enabled ? `<span class="premium-badge"><i class="fa-solid fa-layer-group"></i> شامل الأستاذ: ${escapeHTML(item.bundle_price)} ل.س</span>` : ''}</span>`; return card('file', item, item.description || 'ملف تعليمي محمي بصلاحية وصول.', extra); }, push); else setLoading(); try { const data = await rpc('premium_list_files', args); render(data, 'file', subject.name, 'افتح الملف بعد التحقق من صلاحية الوصول.', item => { const extra = `<span class="premium-file-meta"><span class="premium-badge premium-price"><i class="fa-solid fa-tag"></i> كود الملف: ${escapeHTML(item.access_price)} ل.س</span>${item.bundle_enabled ? `<span class="premium-badge"><i class="fa-solid fa-layer-group"></i> شامل الأستاذ: ${escapeHTML(item.bundle_price)} ل.س</span>` : ''}</span>`; return card('file', item, item.description || 'ملف تعليمي محمي بصلاحية وصول.', extra); }, push); } catch (error) { if (!cached) setEmpty('تعذر تحميل الملفات', friendlyError(error, 'حاول مرة أخرى.')); } }
  function directDriveDownloadUrl(rawUrl) { const value = String(rawUrl || '').trim(); if (!value) return value; try { const url = new URL(value); const host = url.hostname.toLowerCase(); if (host !== 'drive.google.com' && host !== 'docs.google.com' && host !== 'drive.usercontent.google.com') return value; let fileId = url.searchParams.get('id') || ''; const match = url.pathname.match(/\/file\/d\/([^/]+)/) || url.pathname.match(/\/document\/d\/([^/]+)/); if (!fileId && match) fileId = match[1]; if (!fileId) return value; return `https://drive.google.com/uc?export=download&id=${encodeURIComponent(fileId)}`; } catch { return value; } }

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d19">
  <title>نبض التفوق | الاختبارات</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="tests">
  <div class="app">
    <header class="topbar"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-wave-square"></i></span><span><h1>نبض التفوق</h1><small>منصتك نحو التميز</small></span></a><div class="top-actions"><a class="icon-button" href="notifications.html" title="الإشعارات"><i class="fa-regular fa-bell"></i><span class="notification-dot"></span></a></div></header>
    <div class="layout"><aside class="sidebar panel" id="desktopSidebar"></aside><main class="main-content">
      <section class="assessment-page" id="assessmentPage">
        <header class="assessment-hero panel"><div><span class="eyebrow"><i class="fa-solid fa-clipboard-check"></i> تدريب تعليمي</span><h2>نماذج الاختبارات</h2><p>اختر نموذجًا، أجب وفق وقتك، ثم راجع النتيجة والإجابات لتعرف محاور التحسين.</p></div><div class="assessment-hero-stats"><span><i class="fa-solid fa-list-check"></i><b id="testAvailableCount">0</b><small>نماذج متاحة</small></span><span><i class="fa-solid fa-trophy"></i><b id="testBestScore">—</b><small>أفضل نتيجة</small></span></div></header>
        <section class="assessment-toolbar panel" id="testCatalogToolbar"><label class="search-field"><i class="fa-solid fa-magnifying-glass"></i><input id="testSearch" type="search" placeholder="ابحث باسم الاختبار أو المادة"></label><div class="segmented-control assessment-filters" id="testFilterControl"><button class="active" type="button" data-test-filter="all">الكل</button><button type="button" data-test-filter="science">علمي</button><button type="button" data-test-filter="language">لغات</button><button type="button" data-test-filter="general">عام</button></div></section>
        <section class="test-catalog" id="testCatalog" aria-live="polite"></section>
        <section class="test-session hidden" id="testSession" aria-live="polite"></section>
        <section class="test-result-view hidden" id="testResultView" aria-live="polite"></section>
      </section>
    </main></div>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalContent"></div></div>
  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="app.js"></script>
</body>
</html>

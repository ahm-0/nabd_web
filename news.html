  <script id="nabd-theme-init">(()=>{try{const raw=localStorage.getItem('nabd_v3_student')||localStorage.getItem('nabd_v2_student');const saved=raw?JSON.parse(raw):null;const theme=saved?.theme==='light'?'light':'dark';document.documentElement.dataset.theme=theme;const meta=document.querySelector('meta[name=\"theme-color\"]');if(meta)meta.content=theme==='light'?'#f2f7ff':'#080d19';}catch{document.documentElement.dataset.theme='dark';}})();</script><link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body data-page="news">

    <div class="layout">
      <aside class="sidebar panel" id="desktopSidebar"></aside>
      <main class="main-content">
        <div class="news-shell">
          <section id="feed" aria-live="polite"></section>
          <div class="news-composer-dock" id="newsComposerDock" aria-label="شريط كتابة خبر جديد">
            <article class="compose panel" aria-label="نشر خبر إداري">
              <div class="compose-dock-head"><div class="avatar" id="composerAvatar">ن</div><label for="postText">نشر خبر من المشرف</label><span class="compose-image-status" id="composeImageStatus" aria-live="polite"></span></div>
              <div class="compose-message-row"><textarea id="postText" maxlength="1200" rows="1" placeholder="اكتب رسالتك..." aria-label="نص الخبر"></textarea><button class="compose-send-button" id="publishPost" type="button" title="نشر الخبر" aria-label="نشر الخبر"><i class="fa-solid fa-paper-plane"></i></button></div>

            </article>

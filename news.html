<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d19">
  <title>نبض التفوق | مجتمع الأخبار</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="news">
  <div class="app">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-wave-square"></i></span><span><h1>نبض التفوق</h1><small>منصتك نحو التميز</small></span></a>
      <div class="top-actions"><a class="icon-button" href="notifications.html" title="الإشعارات"><i class="fa-regular fa-bell"></i><span class="notification-dot"></span></a></div>
    </header>
    <div class="layout">
      <aside class="sidebar panel" id="desktopSidebar"></aside>
      <main class="main-content">
        <div class="news-shell">
          <header class="news-hero">
            <div class="news-hero-content">
              <div><span class="eyebrow"><i class="fa-solid fa-sparkles"></i> مساحة طلاب نبض</span><h2>مجتمع الأخبار</h2><p>شارك أخبارك التعليمية ولحظات الإنجاز، وتفاعل مع طلاب نبض التفوق في مساحة منظمة وآمنة.</p></div>
              <span class="community-badge"><i class="fa-solid fa-users"></i> مجتمع نبض</span>
            </div>
            <div class="community-overview"><div><i class="fa-regular fa-newspaper"></i><span><b id="communityPostCount">0</b><small>منشورات ظاهرة</small></span></div><div><i class="fa-regular fa-comment-dots"></i><span><b>تفاعل باحترام</b><small>محتوى تعليمي مفيد</small></span></div></div>
          </header>

          <nav class="community-tabs" aria-label="تصفية منشورات المجتمع">
            <button class="community-tab active" data-filter="all" type="button"><i class="fa-solid fa-clock"></i> الأحدث</button>
            <button class="community-tab" data-filter="popular" type="button"><i class="fa-solid fa-fire"></i> الأكثر تفاعلًا</button>
            <button class="community-tab" data-filter="study" type="button"><i class="fa-solid fa-graduation-cap"></i> أخبار الدراسة</button>
            <button class="community-tab" data-filter="mine" type="button"><i class="fa-regular fa-user"></i> منشوراتي</button>
          </nav>

          <article class="compose panel" aria-label="إنشاء منشور جديد">
            <div class="compose-top"><div class="avatar" id="composerAvatar">ن</div><div class="compose-entry"><label for="postText">ماذا تريد أن تشارك مع المجتمع؟</label><textarea id="postText" maxlength="1200" placeholder="اكتب خبرًا مفيدًا، إنجازًا دراسيًا، أو سؤالًا يمكن أن يفيد زملاءك..."></textarea></div></div>
            <div class="compose-preview" id="composePreview"></div>
            <div class="compose-bottom"><div class="attach-buttons"><label title="إضافة حتى صورتين"><i class="fa-regular fa-images"></i><span>إرفاق صور</span><input id="postImages" class="hidden" type="file" accept="image/*" multiple></label><button id="clearImages" title="إزالة الصور" type="button"><i class="fa-solid fa-xmark"></i><span>مسح</span></button></div><button class="primary-button" id="publishPost" type="button"><i class="fa-solid fa-paper-plane"></i> نشر الخبر</button></div>
          </article>

          <div class="feed-toolbar"><div><span class="eyebrow" id="feedEyebrow">الخلاصة التعليمية</span><h3 id="feedTitle">أحدث المنشورات</h3></div><span><i class="fa-solid fa-shield-heart"></i> شارك محتوى مفيدًا ومحترمًا</span></div>
          <section id="feed" aria-live="polite"></section>
        </div>
      </main>
    </div>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalContent"></div></div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>

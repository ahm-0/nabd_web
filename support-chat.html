<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d19">
  <title>نبض التفوق | دعم الطلاب</title>
  <script id="nabd-theme-init">(()=>{try{const raw=localStorage.getItem('nabd_v3_student')||localStorage.getItem('nabd_v2_student');const saved=raw?JSON.parse(raw):null;const theme=saved?.theme==='light'?'light':'dark';document.documentElement.dataset.theme=theme;const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=theme==='light'?'#f2f7ff':'#080d19';}catch{document.documentElement.dataset.theme='dark';}})();</script>
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="styles.css?v=20260823-support-chat">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="pwa.js" defer></script>
</head>
<body data-page="support-chat">
  <div class="app">
    <header class="topbar"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-wave-square"></i></span><span><h1>نبض التفوق</h1><small>منصتك نحو التميز</small></span></a><div class="top-actions"><a class="icon-button" href="notifications.html" title="الإشعارات"><i class="fa-regular fa-bell"></i><span class="notification-dot"></span></a></div></header>
    <div class="layout"><main class="main-content">
      <section class="support-chat-shell">
        <header class="support-chat-head"><a href="profile.html" class="support-chat-back" aria-label="العودة إلى الملف الشخصي"><i class="fa-solid fa-chevron-right"></i></a><span class="support-chat-avatar"><i class="fa-solid fa-headset"></i></span><div><small>فريق نبض التفوق</small><h2>تواصل مع الدعم</h2><p id="supportChatStatus">الدعم متاح للمتابعة</p></div></header>
        <div class="support-chat-notice"><i class="fa-solid fa-shield-heart"></i><span>اكتب مشكلتك أو استفسارك بوضوح؛ ستظهر ردود فريق الدعم في هذه المحادثة.</span></div>
        <section class="support-chat-messages" id="supportChatMessages" aria-live="polite"></section>
        <form class="support-chat-composer" id="supportChatForm"><label class="support-category"><i class="fa-solid fa-tag"></i><select name="category" aria-label="نوع الرسالة"><option>استفسار عام</option><option>مساعدة دراسية</option><option>مشكلة تقنية</option><option>اقتراح تطوير</option></select></label><div><textarea name="message" rows="1" maxlength="700" required placeholder="اكتب رسالتك للدعم..."></textarea><button type="submit" aria-label="إرسال الرسالة" title="إرسال"><i class="fa-solid fa-paper-plane"></i></button></div></form>
      </section>
    </main></div>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav><div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalContent"></div></div><div class="toast" id="toast"></div>
  <script src="vendor/supabase/supabase.js"></script><script src="supabase-client.js?v=20260823-session-fix"></script><script src="app.js?v=20260823-support-chat"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071324">
  <title>دردشة خاصة | نبض التفوق</title>
  <script id="nabd-theme-init">(()=>{try{const raw=localStorage.getItem('nabd_v3_student')||localStorage.getItem('nabd_v2_student');const saved=raw?JSON.parse(raw):null;document.documentElement.dataset.theme=saved?.theme==='light'?'light':'dark'}catch{document.documentElement.dataset.theme='dark'}})();</script>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css?v=20261101-modular">
  <link rel="stylesheet" href="nabd-ui.css?v=20261101-modular">
  <link rel="stylesheet" href="material-ui.css?v=20261101-modular">
  <link rel="stylesheet" href="chat.css?v=20261101-section">
  <link rel="stylesheet" href="nabd-theme.css?v=20261101-unified">
  <script src="nabd-navigation.js?v=20261101-nav" defer></script>
</head>
<body data-page="private-chat" class="private-chat-page">
  <div class="private-chat-screen">
    <header class="private-page-topbar" id="privateChatHeader">
      <button id="privateChatBack" class="chat-top-action" type="button" aria-label="العودة إلى الدردشة الجماعية"><i class="fa-solid fa-arrow-right"></i></button>
      <span class="chat-private-avatar" id="privateChatAvatarPage">ط</span>
      <div class="private-page-title"><b id="privateChatNamePage">دردشة خاصة</b><small id="privateChatStagePage">محادثة بين طرفين</small></div>
      <span class="private-encrypted"><i class="fa-solid fa-lock"></i></span>
    </header>
    <main class="private-page-messages" id="privateChatMessagesPage" aria-live="polite"><div class="private-page-loading"><i class="fa-solid fa-spinner fa-spin"></i><span>جارٍ تحميل المحادثات...</span></div></main>
    <section class="private-conversations-page" id="privateConversationsPage" hidden><div class="private-conversations-page-head"><span class="eyebrow">صندوق الرسائل</span><h1>محادثاتي الخاصة</h1><p>اختر محادثة للمتابعة. ستظهر الرسائل الجديدة هنا مباشرة.</p></div><div id="privateConversationsListPage"></div></section>
    <form class="private-page-composer" id="privateChatFormPage" hidden>
      <button class="private-attach" type="button" aria-label="إضافة مرفق"><i class="fa-solid fa-paperclip"></i></button>
      <textarea name="privateMessage" rows="1" required maxlength="2000" placeholder="اكتب رسالة خاصة..."></textarea>
      <button class="chat-send" type="submit" aria-label="إرسال"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </div>
  <div class="toast" id="toast"></div>
  <script src="vendor/supabase/supabase.js?v=20261101-modular"></script>
<script src="supabase-client.js?v=20261101-modular"></script>
<script src="nabd-app.js?v=20261101-modular"></script>
<script src="material-ui.js?v=20261101-modular"></script>
</body>
</html>

<body data-page="chat">
<div class="chat-screen">
  <header class="chat-topbar"><a class="chat-top-action" href="index.html" aria-label="العودة"><i class="fa-solid fa-arrow-right"></i></a><div class="chat-brand"><span class="chat-brand-mark"><img src="assets/nabd-logo.jpg" alt="شعار نبض التفوق"></span><div><b>دردشة نبض التفوق</b><span id="chatStatsLine">195 مستخدم · 1 متصل الآن</span></div></div><div class="chat-top-actions"><a class="chat-top-action" href="profile.html" aria-label="الملف الشخصي"><i class="fa-regular fa-user"></i></a><button class="chat-top-action" id="chatSettingsButton" type="button" aria-label="إعدادات الدردشة"><i class="fa-solid fa-ellipsis-vertical"></i></button></div></header>
  <main class="chat-main"><section class="chat-messages" id="chatMessages" aria-live="polite"></section></main>

<div class="chat-action-menu" id="chatActionMenu"><button type="button" data-chat-edit><i class="fa-solid fa-pen"></i> تعديل الرسالة</button><button type="button" data-chat-delete><i class="fa-regular fa-trash-can"></i> حذف الرسالة</button></div>

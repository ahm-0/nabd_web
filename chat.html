<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d19"><title>نبض التفوق | الدردشة</title>
<script>(()=>{try{const raw=localStorage.getItem('nabd_v3_student')||localStorage.getItem('nabd_v2_student');const saved=raw?JSON.parse(raw):null;document.documentElement.dataset.theme=saved?.theme==='light'?'light':'dark';}catch{document.documentElement.dataset.theme='dark';}})();</script>
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css"><link rel="stylesheet" href="nabd-ui.css?v=20260921-chat-redesign"><link rel="stylesheet" href="material-ui.css?v=20260917-material3"><link rel="stylesheet" href="chat.css?v=20260924-android-chat-v4"><link rel="manifest" href="manifest.json"><script src="pwa.js?v=20260924-chat-refresh" defer></script>
</head>
<body data-page="chat">
<div class="chat-screen">
  <header class="chat-topbar"><a class="chat-top-action" href="index.html" aria-label="العودة"><i class="fa-solid fa-arrow-right"></i></a><div class="chat-brand"><span class="chat-brand-mark"><img src="assets/nabd-logo.jpg" alt="شعار نبض التفوق"></span><div><b>دردشة نبض التفوق</b><span id="chatStatsLine">جارٍ تحميل الإحصائيات…</span></div></div><div class="chat-top-actions"><button class="chat-top-action chat-private-header-action" id="chatRequestsButton" type="button" aria-label="الرسائل الخاصة"><i class="fa-regular fa-comments"></i><b id="chatRequestsBadge">0</b></button><a class="chat-top-action" href="profile.html" aria-label="الملف الشخصي"><i class="fa-regular fa-user"></i></a><button class="chat-top-action" id="chatSettingsButton" type="button" aria-label="إعدادات الدردشة"><i class="fa-solid fa-ellipsis-vertical"></i></button></div></header>
  <main class="chat-main"><div class="chat-loading-state" id="chatLoadingState" role="status" aria-live="polite"><i class="fa-solid fa-spinner fa-spin"></i><span>جارٍ تحميل الدردشة...</span></div><section class="chat-messages" id="chatMessages" aria-live="polite"></section></main>
  <form class="chat-composer" id="chatForm"><div class="chat-reply-preview hidden" id="chatReplyPreview" role="region" aria-label="الرسالة التي سيتم الرد عليها" aria-hidden="true"><i class="fa-solid fa-reply chat-reply-preview-icon" aria-hidden="true"></i><span class="chat-reply-preview-copy"><b id="chatReplyLabel">الرد على الرسالة</b><small id="chatReplyText"></small></span><button type="button" id="chatReplyCancel" aria-label="إلغاء الرد"><i class="fa-solid fa-xmark"></i></button></div><div class="chat-compose-row"><button type="button" class="chat-compose-icon" title="إضافة" aria-label="إضافة"><i class="fa-solid fa-plus"></i></button><textarea name="chatMessage" rows="1" maxlength="1000" required placeholder="اكتب رسالة..."></textarea><button class="chat-send" type="submit" title="إرسال" aria-label="إرسال"><i class="fa-solid fa-paper-plane"></i></button></div></form>
</div>
<div class="chat-settings-panel" id="chatSettingsPanel" role="dialog" aria-modal="true" aria-label="إعدادات الدردشة"><section class="chat-settings-card"><header><div><span class="eyebrow">نبض التفوق</span><h2>إعدادات الدردشة</h2></div><button class="chat-top-action" id="chatSettingsClose" type="button" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button></header><label class="chat-setting-line"><span><b>إشعارات الدردشة</b><small>التنبيه عند وصول تفاعل أو رسالة جديدة</small></span><input class="switch" id="chatNoticeSwitch" type="checkbox" checked></label><label class="chat-setting-line chat-private-setting"><span><b>السماح بالدردشة الخاصة</b><small>يمكن للطلاب إرسال طلب محادثة خاصة إليك</small></span><input class="switch" id="chatPrivateSwitch" type="checkbox" checked></label><form id="chatBioForm"><label class="chat-bio-label" for="chatBio">نبذة تظهر في ملفك</label><textarea id="chatBio" name="chatBio" maxlength="180" placeholder="اكتب نبذة قصيرة..."></textarea><button class="primary-button" type="submit"><i class="fa-solid fa-check"></i> حفظ النبذة</button></form><p class="chat-settings-note"><i class="fa-solid fa-circle-info"></i> يتم تحديث الاسم والصورة تلقائياً من ملفك الشخصي.</p></section></div>
<div class="chat-profile-panel" id="chatProfilePanel" role="dialog" aria-modal="true" aria-label="ملف طالب"><section class="chat-profile-card"><button class="chat-profile-close" data-chat-profile-close type="button"><i class="fa-solid fa-xmark"></i></button><span class="chat-profile-avatar" id="chatProfileAvatar">ط</span><h2 id="chatProfileName">طالب نبض التفوق</h2><span class="chat-profile-stage" id="chatProfileStage">المرحلة الدراسية</span><p id="chatProfileBio">نبذة الطالب</p><div class="chat-profile-actions"><button class="primary-button" id="chatPrivateStart" type="button"><i class="fa-solid fa-lock"></i> بدء دردشة خاصة</button></div></section></div>
<div class="chat-conversations-panel" id="chatConversationsPanel" role="dialog" aria-modal="true" aria-label="محادثاتي"><section class="chat-conversations-card"><header><div><span class="eyebrow">الرسائل الخاصة</span><h2>محادثاتي</h2></div><button class="chat-profile-close" data-chat-conversations-close type="button"><i class="fa-solid fa-xmark"></i></button></header><button class="chat-notification-link chat-conversations-requests" id="chatOpenRequests" type="button"><i class="fa-regular fa-bell"></i><span>طلبات الدردشة الخاصة</span><b id="chatConversationsRequestsBadge">0</b></button><div id="chatConversationsList"></div></section></div>
<div class="chat-requests-panel" id="chatRequestsPanel" role="dialog" aria-modal="true" aria-label="طلبات الدردشة"><section class="chat-requests-card"><header><h2>طلبات الدردشة الخاصة</h2><button class="chat-profile-close" data-chat-requests-close type="button"><i class="fa-solid fa-xmark"></i></button></header><div id="chatRequestsList"></div></section></div>
<div class="private-chat-panel" id="privateChatPanel" role="dialog" aria-modal="true" aria-label="دردشة خاصة"><section class="private-chat-card"><header><button class="chat-top-action" data-private-chat-close type="button" aria-label="رجوع"><i class="fa-solid fa-arrow-right"></i></button><span class="chat-private-avatar" id="privateChatAvatar">ط</span><div><b id="privateChatName">دردشة خاصة</b><small>محادثة مشفرة بين طرفين</small></div></header><div class="private-chat-messages" id="privateChatMessages"></div><form class="private-chat-composer" id="privateChatForm"><textarea name="privateMessage" rows="1" required placeholder="اكتب رسالة خاصة..."></textarea><button type="submit" class="chat-send"><i class="fa-solid fa-paper-plane"></i></button></form></section></div>
<div class="chat-action-menu" id="chatActionMenu"><div class="chat-action-buttons"><button type="button" data-chat-pin-action><i class="fa-solid fa-thumbtack"></i> تثبيت</button><button type="button" data-chat-edit><i class="fa-solid fa-pen"></i> تعديل</button><button type="button" data-chat-delete><i class="fa-regular fa-trash-can"></i> حذف</button></div><div class="chat-action-reactions" aria-label="التفاعلات"><span>تفاعل</span><button type="button" data-chat-reaction-option="👍">👍</button><button type="button" data-chat-reaction-option="❤️">❤️</button><button type="button" data-chat-reaction-option="😂">😂</button><button type="button" data-chat-reaction-option="😮">😮</button><button type="button" data-chat-reaction-option="😢">😢</button><button type="button" data-chat-reaction-option="🙏">🙏</button></div></div>
<div class="toast" id="toast"></div>
<script src="vendor/supabase/supabase.js"></script><script src="supabase-client.js?v=20260823-session-fix"></script><script src="nabd-app.js?v=20260924-chat-performance-3"></script><script src="material-ui.js?v=20260917-material3"></script>
</body></html>

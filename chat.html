<!doctype html>
<html lang="ar" dir="rtl">
<head>
<script>(()=>{try{const f=(location.pathname.split('/').pop()||'index.html');if(/^(auth|privacy|about)(\.html)?$/.test(f))return;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&/^sb-.*-auth-token$/.test(k))return;}document.documentElement.style.visibility='hidden';location.replace('auth.html');}catch(e){}})();</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#071324">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>الدردشة | نبض التفوق</title>
<script>(()=>{try{const raw=localStorage.getItem('nabd_v3_student')||localStorage.getItem('nabd_v2_student');const saved=raw?JSON.parse(raw):null;const t=saved?.theme==='dark'&&saved?.themeSet?'dark':'light';document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='light'?'#ffffff':'#071324'}catch{document.documentElement.dataset.theme='light'}})();</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://vyjosbxjizttdwnrphza.supabase.co" crossorigin>
<link rel="stylesheet" href="chat-app.css">
<script src="vendor/supabase/supabase.js" defer></script>
<script src="supabase-client.js" defer></script>
<script src="nabd-mentions.js"></script>
<script src="nabd-ptr.js" defer></script>
<script src="chat-app.js" defer></script>
<script src="pwa.js" defer></script>
<script src="screen-guard.js" defer></script><script src="nabd-points.js" defer></script><script src="nabd-badges.js" defer></script></head>
<body data-page="chat">
<div class="app" id="app">

  <!-- قائمة المحادثات -->
  <section class="pane list-pane" id="listPane" aria-label="المحادثات">
    <header class="topbar">
      <div class="brand">
        <img src="assets/nabd-logo.jpg" alt="" width="38" height="38">
        <div><h1>نبض التفوق</h1><small id="listSub">الدردشة</small></div>
      </div>
      <button class="icon-btn" id="searchToggle" type="button" aria-label="بحث"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="icon-btn" id="listMenuBtn" type="button" aria-label="المزيد"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
    </header>
    <div class="searchbar" id="searchBar" hidden><input id="searchInput" type="search" placeholder="ابحث في المحادثات…" autocomplete="off" enterkeyhint="search"></div>
    <div class="scroll" id="convScroll">
      <div id="convList"><div class="skeleton"><i></i><i></i><i></i><i></i><i></i></div></div>
    </div>
    <nav class="bottom-nav" id="bottomNav" aria-label="التنقل">
      <a href="chat.html" class="active" aria-current="page"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 012 2v10a2 2 0 01-2 2H9l-5 4v-4a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg><span>الدردشة</span><b class="badge" id="navBadge" hidden>0</b></a>
      <button type="button" id="navAi"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9 16h6"/></svg><span>AI</span></button>
      <a href="index.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg><span>الرئيسية</span></a>
      <a href="news.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h12a2 2 0 012 2v13a1 1 0 01-1 1H6a2 2 0 01-2-2V5a1 1 0 011-1zM8 8h7M8 12h7M8 16h4"/></svg><span>الأخبار</span></a>
      <a href="profile.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg><span>حسابي</span></a>
    </nav>
  </section>

  <!-- نافذة المحادثة (عامة أو خاصة) -->
  <section class="pane chat-pane" id="chatPane" aria-label="المحادثة">
    <div class="placeholder"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 012 2v10a2 2 0 01-2 2H9l-5 4v-4a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg><b>اختر محادثة للبدء</b><span>رسائلك تُزامَن لحظيًا</span></div>
    <header class="chat-top">
      <button class="icon-btn back" id="backBtn" type="button" aria-label="رجوع"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="who" id="chatWho" type="button"><span id="chatAv"></span><div style="min-width:0"><b id="chatTitle"></b><small id="chatSub"></small></div></button>
      <button class="icon-btn" id="blockBtn" type="button" aria-label="حظر المستخدم" title="حظر المستخدم" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg></button>
      <button class="icon-btn" id="chatMenuBtn" type="button" aria-label="خيارات" hidden><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
    </header>
    <button class="pinned-bar" id="pinnedBar" type="button" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 7 3 3v2H7v-2l3-3z"/></svg><div><b>رسالة مثبّتة</b><span id="pinnedText"></span></div></button>
    <div class="announce" id="announce" hidden></div>
    <div class="msgs-wrap">
      <div class="msgs" id="msgs" role="log" aria-live="polite"></div>
      <button class="fab" id="fab" type="button" aria-label="إلى آخر الرسائل" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg><b class="badge" id="fabBadge" hidden>0</b></button>
    </div>
    <form class="composer" id="composer" autocomplete="off">
      <div class="ctx" id="ctx" hidden><svg class="ic" id="ctxIc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 016 6v3"/></svg><div><b id="ctxTitle"></b><span id="ctxText"></span></div><button class="icon-btn" id="ctxCancel" type="button" aria-label="إلغاء"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="img-prev" id="imgPrev" hidden><img id="imgPrevImg" alt=""><span id="imgPrevName">صورة جاهزة للإرسال</span><button class="once-toggle" id="onceToggle" type="button" aria-pressed="false" hidden title="تُعرض مرة واحدة فقط">👁 مرة واحدة</button><button class="icon-btn" id="imgPrevX" type="button" aria-label="إزالة الصورة"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="compose-row">
        <button class="attach" id="attachBtn" type="button" aria-label="إرفاق صورة"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="4"/><circle cx="9" cy="10" r="1.7"/><path d="M21 16l-5-5-9 9"/></svg></button>
        <input id="imgFile" type="file" accept="image/*" hidden>
        <textarea id="input" rows="1" maxlength="1000" placeholder="اكتب رسالة…" enterkeyhint="send" aria-label="نص الرسالة"></textarea>
        <button class="send" id="sendBtn" type="submit" aria-label="إرسال" disabled><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
      </div>
      <div class="counter" id="counter" hidden></div>
    </form>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="menu" id="menu" role="menu"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;text-align:center">يلزم تفعيل JavaScript لاستخدام الدردشة.</p></noscript>
</body>
</html>
